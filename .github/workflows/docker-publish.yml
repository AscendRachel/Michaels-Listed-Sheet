# Builds the Docker image on GitHub and publishes it to Docker Hub.
#
#   Release:   git tag v1.0.0 && git push origin v1.0.0     -> image  <user>/michaels-listed-sheet:1.0.0  and  :latest
#   Or press "Run workflow" on the Actions tab of the repository (builds :latest from the current main).
#
# One-time setup (in the GitHub repository: Settings > Secrets and variables > Actions > New repository secret):
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      a Docker Hub access token with Read & Write permission (Docker Hub > Account settings > Personal access tokens)
# Create the Docker Hub repository "michaels-listed-sheet" as PRIVATE first (a repository created by a push may be public).
name: Build and publish the Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/michaels-listed-sheet
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
